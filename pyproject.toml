[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hippo"
version = "0.1.0"
description = "Pharmacy claims reconciliation and reporting pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hippo = "hippo.pipeline:main"

[tool.setuptools.packages.find]
include = ["hippo*"]
